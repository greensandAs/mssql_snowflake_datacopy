# =============================================================================
# Tiger Analytics — Streamlit Theme Configuration (OPTIONAL)
# =============================================================================
# IMPORTANT: This file is OPTIONAL and serves as a supplementary measure only.
#
# config.toml has LIMITED support in Snowflake Streamlit warehouse runtimes
# and incomplete support in container runtimes. The [theme.light] / [theme.dark]
# dual-theme blocks are NOT reliably supported in SiS.
#
# PRIMARY THEMING: All visual theming (backgrounds, text, sidebar, components)
# is handled by Python CSS injection via inject_global_css() in css_injector.py.
#
# This file only sets primaryColor, which controls Streamlit's built-in widget
# accent colors (slider thumbs, checkbox ticks, spinner) where CSS cannot reach.
#
# Copy to: your_app/.streamlit/config.toml
# =============================================================================

[theme]
primaryColor = "#F15A22"
